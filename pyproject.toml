[project]
name = "exness-mt5-agent"
version = "1.0.0"
description = "Exness MT5 research and demo execution agent"
requires-python = ">=3.11"
dependencies = [
    "MetaTrader5>=5.0.45",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "xgboost>=2.0.3",
    "joblib>=1.3",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["exness_mt5_agent*"]
